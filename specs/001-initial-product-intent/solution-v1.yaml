deferred_solution_nodes:
  - Hosted Cloudflare control plane
  - Outbound remote runner enrollment
  - Additional execution-provider adapters
  - Parallel task dispatch
  - Automatic repair dispatch
  - Public developer API
  - Graph database
  - graphslop.com route or traffic cutover
protected_assertions:
  - Intent and Solution baselines are immutable and authoritative.
  - Models propose; deterministic code validates and advances state.
  - Every Execution task must trace to Solution and transitively to Intent.
  - Only one bounded task may be active at a time.
  - Implementation and verification must use separate invocations.
  - Repair remains idle until owner-authorized.
  - No push, pull request, merge, deployment, domain, or traffic action is authorized.
