      Stable topological ordering selects at most one task. Cycles, stale accepted
      dependencies, unfinished ancestors, failed dependencies, active work, and
      missing owner authorization never dispatch.
  - id: V2-005-AC-04
    outcome: pass
    evidence: >-
      Completeness requires full per-node Intent-to-Solution-to-Execution closure,
      accepted tasks, distinct independent Check evidence, success evidence, current
      baseline bindings, system checks, resolved decisions, and no blocking drift.
  - id: V2-005-AC-05
    outcome: pass
    evidence: >-
      The public advanceFactory validates exact current graph snapshots and baselines,
      binds graph-derived closure facts, rejects projection-only or invented input,
      and returns complete only for the valid graph-backed closure.
