necessary_repairs:
  - Correction deltas retain prior and next meaning; unknown targets fail without graph mutation.
  - Empty proposals fail closed and unresolved discovery always exposes exactly one deterministic question.
  - Codex receives current stable node IDs but cannot supply IDs, timestamps, hashes, or authority.
  - Baseline and approval IDs are unique and exact current snapshot hashes prevent stale replay.
  - Review cannot clear a blocker; explicit owner answer or deferral creates durable resolution evidence.
  - Question resolution requires the exact expected question ID and stale actions do not mutate state.

