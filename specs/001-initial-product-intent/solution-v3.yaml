technical_defaults:
  - Reuse the existing Solution model gateway to propose Roles.
  - Reuse ExecutionTask and TaskLease policy as the only authority source.
  - Store RoleDefinition as a Solution node and bind role_ref on Execution tasks and evidence.
  - Render the five headings from validated fields; do not send a second hidden role essay.
  - Keep optional Persona advice as CARE and WATCH fields on a future traced advice node; zero advice is valid.
  - Use the existing projection engine and Solution review page; add no team service or team database.
deferred_solution_nodes:
  - Persistent fictional agent identities
  - Rich Persona profiles
  - Separate Capability graph nodes
  - A fourth Team Graph
  - Parallel task dispatch
  - Additional worker adapters
  - Autonomous repair or release
  - graphslop.com route or traffic cutover
protected_assertions:
  - The exact task, protected baselines, lease, runner policy, and narrowest deny remain authoritative.
  - A Role or Persona string cannot grant permission.
  - Duplicate Roles fail validation or are merged before Solution review.
  - Zero Personas is a valid team.
  - Build and Check use different worker invocations.
  - Local application code and bounded task dispatch require this exact approved baseline.
  - Push, pull request, merge, deployment, domain, and traffic actions remain unauthorized.
