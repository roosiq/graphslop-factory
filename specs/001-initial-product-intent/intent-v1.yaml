protected_assertions:
  - id: no-premature-code
    statement: No application code or repository execution may begin before both intent and solution baselines are approved.
    source_intent_nodes: [INT-003, INT-009, INT-010, INT-011]
  - id: three-real-graphs
    statement: Intent, Solution, and Execution are persistent typed runtime graphs, not prose substitutes.
    source_intent_nodes: [INT-005, INT-010, INT-011, INT-021, INT-022]
  - id: caveman-control-surface
    statement: The owner controls and corrects the factory in ordinary language without authoring graph syntax or prompts.
    source_intent_nodes: [INT-004, INT-023]
  - id: complete-traceability
    statement: Execution traces to Solution, and Solution traces to approved Intent.
    source_intent_nodes: [INT-010, INT-011, INT-012, INT-018]
  - id: immutable-baselines
    statement: Approved baseline versions are never silently overwritten.
    source_intent_nodes: [INT-006, INT-009, INT-016]
  - id: owner-only-private-workspace
    statement: Only the one authenticated project owner may access project state, connect the repository, or authorize execution.
    source_intent_nodes: [INT-019]
  - id: single-project-repository
    statement: The first release supports one active project and one connected repository.
    source_intent_nodes: [INT-017, INT-019, INT-024]
  - id: sequential-single-adapter
    statement: The first release implements one execution-provider adapter and dispatches at most one task at a time.
    source_intent_nodes: [INT-017, INT-024]
  - id: owner-authorized-repair
    statement: Repair tasks are typed graph work but cannot dispatch without explicit owner authorization.
    source_intent_nodes: [INT-015, INT-024]
  - id: no-public-api-requirement
    statement: A public developer API is not required for the first release.
    source_intent_nodes: [INT-024]
  - id: no-hosted-execution-requirement
    statement: The first release does not require repository code to execute inside the hosted web runtime.
    source_intent_nodes: [INT-024]
  - id: no-autonomous-release
    statement: Draft pull request readiness grants no merge, deployment, domain, or traffic authority.
    source_intent_nodes: [INT-017, INT-018, INT-019]
