protected_assertions:
  - id: no-premature-code
    statement: No application code or repository execution may begin before both current Intent and Solution Baselines are approved.
    source_intent_nodes: [INT-003, INT-009, INT-010, INT-011]
  - id: three-authoritative-graphs
    statement: Intent, Solution, and Execution remain persistent typed authoritative graphs; any team view is a traceable projection unless a future baseline explicitly adds another authoritative graph.
    source_intent_nodes: [INT-005, INT-010, INT-011, INT-021, INT-022, INT-029]
  - id: caveman-control-surface
    statement: The owner controls and corrects the factory in ordinary language without authoring graph syntax, role contracts, task files, or prompts.
    source_intent_nodes: [INT-004, INT-023, INT-025, INT-029]
  - id: complete-traceability
    statement: Execution traces to Solution, Solution traces to approved Intent, and every Role and Persona cites the Solution needs that justify it.
    source_intent_nodes: [INT-010, INT-011, INT-012, INT-018, INT-025, INT-026, INT-027, INT-029]
  - id: immutable-baselines
    statement: Approved baseline versions are never silently overwritten.
    source_intent_nodes: [INT-006, INT-009, INT-016]
  - id: role-bounded-authority
    statement: A worker receives only the intersection of Role, task, current baselines, and owner-authorized lease permissions; the narrowest bound wins.
    source_intent_nodes: [INT-012, INT-013, INT-014, INT-026, INT-028]
  - id: persona-is-advisory
    statement: Persona content may influence perspective or communication but can never create or expand permissions, authority, readiness, approval, or verification independence.
    source_intent_nodes: [INT-014, INT-027, INT-028]
  - id: independent-role-and-worker
    statement: A producer cannot verify or accept its own result; verification requires a different Role assignment and worker invocation.
    source_intent_nodes: [INT-014, INT-015, INT-028]
  - id: project-specific-team
    statement: Roles and Personas are generated from approved project needs rather than a fixed fictional cast or universal agent sequence.
    source_intent_nodes: [INT-025, INT-026, INT-027]
  - id: owner-only-private-workspace
    statement: Only the one authenticated project owner may access project state, connect the repository, approve baselines, or authorize execution.
    source_intent_nodes: [INT-019]
  - id: single-project-repository
    statement: The first release supports one active project and one connected repository.
    source_intent_nodes: [INT-017, INT-019, INT-024]
  - id: sequential-single-adapter
    statement: The first release implements one execution-provider adapter and dispatches at most one task at a time.
    source_intent_nodes: [INT-017, INT-024]
  - id: owner-authorized-repair
    statement: Repair tasks are typed graph work but cannot dispatch without explicit owner authorization.
    source_intent_nodes: [INT-015, INT-024]
  - id: no-public-api-requirement
    statement: A public developer API is not required for the first release.
    source_intent_nodes: [INT-024]
  - id: no-hosted-execution-requirement
    statement: The first release does not require repository code to execute inside the hosted web runtime.
    source_intent_nodes: [INT-024]
  - id: no-autonomous-release
    statement: Draft pull request readiness grants no push, merge, deployment, domain, or traffic authority.
    source_intent_nodes: [INT-017, INT-018, INT-019]
