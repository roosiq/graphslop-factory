completion_contract:
  complete_when_all_empty:
    - uncovered_required_intent
    - uncovered_required_solution
    - unaccepted_required_tasks
    - missing_required_evidence
    - blocking_drift
    - stale_work
    - failed_system_checks
  never_complete_when:
    - a blocking question or owner decision is unresolved
    - the approved baseline hashes do not match
    - the project is incomplete but no next action exists
flywheel_order:
  - Validate current baseline hashes and graph compatibility.
  - Compute trace and evidence closure.
  - Route stale work to impact analysis.
  - Route produced work to independent checking.
  - Route drift to owner repair authorization or an authorized Repair task.
  - Select one ready task by stable topological order and task ID.
  - Return COMPLETE only when the completion report has no gaps.
  - Otherwise emit a MissingWorkReport and require recompilation or an owner decision.
