        required_outputs: [implementation, focused tests, changed-file evidence, unresolved issues]
        required_capability: SOL-CAP-003
        independence_class: producer
        dependencies: [SOL-ROLE-002]
        permission_ceiling: [task allowed paths, approved local test commands]
        forbidden_actions: [change product meaning, broaden graph types, approve own work, external side effects]
        review_obligations: [prove deterministic behavior and exact reference handling]
        acceptance_responsibilities: [task checks, regression checks, trace evidence]
        selection_rationale: The immutable typed graph kernel is an independent architectural boundary.
      scope: product
      satisfies: [INT-011, INT-012, INT-022, INT-026]
