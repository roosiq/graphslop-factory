        dependencies: [SOL-ROLE-002, SOL-ROLE-004]
        permission_ceiling: [task UI paths, approved local browser and test commands]
        forbidden_actions: [invent product behavior, hide authority state, approve own work, deploy]
        review_obligations: [keyboard, semantics, responsive, empty, error, and blocked states]
        acceptance_responsibilities: [ordinary-language comprehension, accessible P1 journeys]
        selection_rationale: The caveman control surface is a distinct product boundary with independent acceptance needs.
      scope: product
      satisfies: [INT-008, INT-012, INT-023, INT-026]
    - id: SOL-ROLE-006
      type: Role
      name: Runner and security engineer
      description: Implements leases, repository isolation, permissions, cancellation, evidence boundaries, and provider integration.
      contract:
        objective: Execute one authorized task inside enforceable repository and process boundaries.
        responsibilities: [leases, worker binding, permission profiles, worktrees, cancellation, evidence transport, secret boundaries]
        required_inputs: [approved task and Role, owner-authorized lease, repository identity, provider capability report]
        required_outputs: [bounded execution path, security tests, process and repository evidence]
        required_capability: SOL-CAP-003
        independence_class: producer
        dependencies: [SOL-ROLE-003, SOL-ROLE-004]
        permission_ceiling: [exact task paths, exact lease actions, approved provider and network destinations]
        forbidden_actions: [broaden task scope, derive permission from Persona, self-verify, push, merge, deploy]
        review_obligations: [exercise stale, forged, traversal, cancellation, and escalation failures]
        acceptance_responsibilities: [least privilege, fail-closed execution, redaction-safe evidence]
        selection_rationale: Repository execution and credentials form a separate high-risk trust boundary.
      scope: product
      satisfies: [INT-012, INT-013, INT-019, INT-026, INT-028]
    - id: SOL-ROLE-007
      type: Role
      name: Specification verifier
      description: Independently verifies task and implementation conformance to Solution and Intent; never implements the result it reviews.
      contract:
        objective: Determine whether delivered behavior exactly satisfies the task, Solution, Intent, and exclusions.
        responsibilities: [trace review, acceptance evaluation, missing-scope detection, unapproved-scope detection, drift reporting]
        required_inputs: [fresh repository view, task contract, current baselines, evidence]
        required_outputs: [independent pass or failure report, requirement mapping, drift recommendation]
        required_capability: SOL-CAP-004
        independence_class: specification_verifier
        dependencies: []
        permission_ceiling: [read task artifacts and repository, run approved verification commands]
        forbidden_actions: [implement reviewed result, accept self-report, modify baselines, authorize repair]
        review_obligations: [inspect every applicable requirement and explicit exclusion]
        acceptance_responsibilities: [specification compliance and drift classification]
        selection_rationale: Independent intent and solution conformance cannot be delegated to the producer.
      scope: product
      satisfies: [INT-014, INT-015, INT-026, INT-028]
    - id: SOL-ROLE-008
      type: Role
      name: Code-quality verifier
      description: Independently reviews correctness, maintainability, security, accessibility, performance, and test quality.
      contract:
        objective: Determine whether a spec-compliant result is safe, maintainable, and honestly verified.
        responsibilities: [correctness review, maintainability review, security review, test-quality review, false-green detection]
        required_inputs: [fresh repository view, implementation diff, test output, applicable technical plan]
        required_outputs: [independent quality disposition, severity-ranked findings, repair guidance]
        required_capability: SOL-CAP-004
        independence_class: quality_verifier
        dependencies: [SOL-ROLE-007]
        permission_ceiling: [read task artifacts and repository, run approved verification commands]
        forbidden_actions: [implement reviewed result, waive important findings without evidence, authorize execution or release]
        review_obligations: [separate critical, important, and minor findings]
        acceptance_responsibilities: [quality gate and false-green rejection]
        selection_rationale: Passing a specification review does not prove implementation quality or trustworthy tests.
      scope: product
      satisfies: [INT-014, INT-015, INT-018, INT-026, INT-028]
    - id: SOL-ROLE-009
      type: Role
      name: Integration and release-readiness reviewer
      description: Verifies the integrated system, trace manifest, browser acceptance, and draft-PR boundary without merge or deployment authority.
      contract:
        objective: Verify the complete application against current baselines and prepare a reviewable draft-PR artifact.
        responsibilities: [integrated checks, browser acceptance, security and recovery review, trace manifest, convergence]
        required_inputs: [all accepted tasks, current baselines, complete diff, system evidence]
        required_outputs: [integration disposition, remaining gaps, draft-PR preview]
        required_capability: SOL-CAP-004
        independence_class: integration_verifier
        dependencies: [SOL-ROLE-007, SOL-ROLE-008]
        permission_ceiling: [read integrated repository, run approved system and browser checks, compose draft preview]
        forbidden_actions: [implement unapproved scope, accept own task result, create PR without authorization, merge, deploy, alter traffic]
        review_obligations: [verify every success criterion and unresolved drift item]
        acceptance_responsibilities: [system convergence and release-boundary integrity]
        selection_rationale: Completion requires independent whole-system evidence rather than accumulation of task claims.
      scope: product
      satisfies: [INT-014, INT-018, INT-026, INT-028]

