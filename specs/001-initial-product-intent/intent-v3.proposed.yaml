changed_nodes:
  - id: INT-025
    from_version: 1
    to_version: 2
    statement: Generate only the smallest useful team; merge overlapping Roles and reject unjustified Roles.
  - id: INT-026
    from_version: 1
    to_version: 2
    statement: Show each Role as JOB, USE, TOUCH, DON'T, and DONE while enforcing exact policy structurally.
  - id: INT-027
    from_version: 1
    to_version: 2
    statement: Make Personas optional CARE and WATCH notes with no biography, character, or authority.
  - id: INT-029
    from_version: 1
    to_version: 2
    statement: Show team trace and authority in one compact ordinary-language view.
new_nodes:
  - id: INT-030
    version: 1
    type: Constraint
    statement: All generated agent and Role instructions use short, direct, ordinary language.
changed_exclusions:
  - id: EXC-007
    from_version: 2
    to_version: 3
    statement: Exclude fake org charts, biographies, role-play, decorative Personas, duplicate Roles, personality authority, and long prompts that restate machine policy.
proposed_decision:
  id: DEC-004
  version: 1
  statement: Keep rich machine validation and expose only the smallest caveman brief needed to act and review safely.
proposed_protected_assertions:
  - id: lean-project-team
    statement: A Role must have a distinct job, permission boundary, handoff, or independence reason; overlapping Roles are merged.
    source_intent_nodes: [INT-025]
  - id: caveman-worker-brief
    statement: Worker-facing Role instructions use JOB, USE, TOUCH, DON'T, and DONE in short ordinary language.
    source_intent_nodes: [INT-026, INT-030]
  - id: structured-policy-is-authority
    statement: Exact machine-readable task policy is authoritative, cannot be broadened by prose, and stops dispatch on disagreement.
    source_intent_nodes: [INT-012, INT-013, INT-026, INT-028, INT-030]
  - id: persona-is-tiny-and-optional
    statement: Persona context is optional CARE and WATCH advice and never creates permission or authority.
    source_intent_nodes: [INT-014, INT-027, INT-028]
  - id: independent-role-and-worker
    statement: A producer cannot verify or accept its own result.
    source_intent_nodes: [INT-014, INT-015, INT-028]
blocking_questions:
