expected:
  statement: A task with ownerAuthorization not_authorized cannot satisfy a dependency closure or the completion contract, even if its status is accepted and has passing Check evidence. Authorization is an exact machine authority boundary and must not be bypassed by claiming terminal status.
  sources:
    - specs/001-initial-product-intent/execution-v2.yaml
    - solution-v3-protected-assertion-exact-task-lease-runner-policy-and-narrowest-deny
    - scheduler-owner-authorization-is-explicit
observed:
  statement: dependencyClosureState treats every accepted dependency as valid once its baselines match. It does not inspect the accepted dependency's ownerAuthorization. Completeness also treats an unauthorized accepted required task as complete when its evidence otherwise closes. Both the public scheduler and advanceFactory select a ready dependant after an unauthorized accepted dependency, and advanceFactory can return complete for an unauthorized accepted project.
  files:
    - packages/graph-kernel/src/execution/scheduler.ts
    - packages/graph-kernel/src/execution/completeness.ts
    - packages/graph-kernel/src/execution/flywheel.ts
reproduction:
  command: >-
    node --input-type=module -e "import { scheduleExecutionTasks } from './packages/graph-kernel/dist/index.js'; import { task } from './tests/kernel/completeness-fixtures.mjs'; console.log(scheduleExecutionTasks({tasks:[task('unauthorized-accepted',{status:'accepted',ownerAuthorization:'not_authorized'}),task('candidate',{status:'ready',dependencies:['unauthorized-accepted']})],currentIntentBaseline:{baselineId:'intent-v1',contentHash:'a'.repeat(64)},currentSolutionBaseline:{baselineId:'solution-v1',contentHash:'b'.repeat(64)}}));"
  result:
    scheduler_selected_task: candidate
    scheduler_blockers: []
  dependant_integrated_result:
    completeness_valid: true
    flywheel_action: execute_task
    scheduler_selected_task: candidate
  early_completion:
    setup: An otherwise valid completeInput with its sole accepted task changed to ownerAuthorization not_authorized.
    command: >-
      node --input-type=module -e "import { evaluateCompleteness, advanceFactory } from './packages/graph-kernel/dist/index.js'; import { completeInput } from './tests/kernel/completeness-fixtures.mjs'; const input=completeInput(); input.tasks[0].ownerAuthorization='not_authorized'; console.log({report:evaluateCompleteness(input),advance:advanceFactory(input)});"
    result:
      completeness_valid: true
      completeness_complete: true
      flywheel_action: complete
impact:
  statement: Unapproved or forged work can be declared accepted and become an authority source for later dispatch or final project completion. This violates the protected task-authorization boundary and permits execution drift without an owner decision.
recommended_repair:
  type: Repair
  instruction: >-
    Require every accepted dependency and every accepted required task to retain explicit authorized owner authority, or model immutable dispatch authorization separately and bind accepted evidence to it. Report unauthorized accepted ancestors and terminal tasks deterministically, prevent selection, and make advanceFactory return missing_work or block_invalid_state rather than complete. Add direct, transitive, early-completion, and non-mutation regression tests.
