impact:
  statement: A caller of the exported scheduler can dispatch work that relies on an accepted result from an obsolete approved baseline. advanceFactory currently catches this through completeness evaluation, but the scheduler is a public safety boundary and does not fail closed on its own input.
recommended_repair:
  type: Repair
  instruction: >-
    Evaluate baseline freshness for every non-discarded task required to satisfy a candidate's dependency closure. A stale accepted dependency must either make the candidate non-dispatchable with a deterministic stale/dependency blocker, or invalidate the scheduler input. Add a direct scheduler regression test and preserve the existing flywheel impact-analysis behavior.
