  statement: scheduleExecutionTasks checks baseline equality only for ready or authorized candidates. It treats an accepted dependency with a stale protected baseline as satisfied and selects its current-baseline dependant without a stale or dependency blocker.
  file: packages/graph-kernel/src/execution/scheduler.ts
  locations:
    - staleTaskIds derives from eligible tasks only
    - blockedDependencyTaskIds treats accepted status as sufficient
reproduction:
  command: >-
    node --input-type=module -e "import { scheduleExecutionTasks } from './packages/graph-kernel/dist/index.js'; import { completeInput, task } from './tests/kernel/completeness-fixtures.mjs'; const input=completeInput(); input.tasks[0].protectedSolutionBaseline={baselineId:'solution-v0',contentHash:'b'.repeat(64)}; input.tasks.push(task('new-step',{status:'ready',dependencies:['task-alpha']})); console.log(scheduleExecutionTasks({tasks:input.tasks,currentIntentBaseline:input.currentIntentBaseline,currentSolutionBaseline:input.currentSolutionBaseline}));"
