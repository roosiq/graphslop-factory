expected:
  statement: >-
    A GraphSnapshot contentHash must be the SHA-256 digest of the documented canonical
    snapshot bytes with contentHash omitted. Graph validation and the authoritative factory
    must reject a snapshot whose fields changed while its claimed hash, baseline reference,
    and cross-graph refs retain an older digest. A frozen approved baseline must therefore
    bind actual graph content, not an arbitrary hash-shaped string supplied beside it.
