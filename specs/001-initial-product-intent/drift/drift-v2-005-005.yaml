impact:
  statement: >-
    An altered Intent, Solution, or Execution graph can masquerade as the approved graph by
    retaining its old hash-shaped contentHash and matching baseline reference. Because the
    closure is then derived from the altered graph, the factory can declare completion for a
    different owner outcome without a new immutable baseline, impact analysis, or approval.
    This defeats the central no-drift and intent-freeze boundary.
recommended_repair:
  type: Repair
  instruction: >-
    Implement the documented canonical snapshot hash contract in the graph kernel: omit
    contentHash, stably order every set-like collection by its specified key, RFC-8785
    canonicalize, SHA-256 the UTF-8 bytes, and require the resulting lowercase digest to equal
    every supplied current or source GraphSnapshot.contentHash before any semantic validation
    or factory closure work. Give mismatches a stable structured error and make advanceFactory
    block through its graph-validation-first path. Replace placeholder fixture hashes with
    correctly derived hashes and add valid, statement-mutation, edge-mutation,
    cross-link-mutation, source-snapshot, baseline, deterministic, and non-mutation tests.
    Do not change approved intent-v3 or solution-v3 baselines, broaden worker authority, or
    add a database or product feature.
