observed:
  statement: >-
    GraphSnapshotSchema requires only a lowercase 64-character string. validateGraphSnapshots
    validates grammar and self-declared references but never canonicalizes or hashes snapshot
    bytes; its own contract comment says it performs no hashing. The authoritative factory
    compares baseline.snapshotContentHash only to the snapshot's unverified contentHash field.
    No source code imports a SHA-256 primitive or implements the specified canonical hash
    contract.
  files:
