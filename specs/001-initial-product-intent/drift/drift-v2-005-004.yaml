observed:
  statement: >-
    validateGraphSnapshots validates GraphValidationInput only as a separate exported pure
    function. advanceFactory imports neither it nor GraphValidationInput, accepts only the
    denormalized CompletenessInput projection, and rejects snapshots and approvedBaselines
    as unknown keys. A complete-looking projection with no GraphSnapshot values at all
    returns COMPLETE, so malformed, stale, or unrelated graph snapshots cannot influence
    the flywheel decision.
  files:
    - packages/graph-kernel/src/validate.ts
    - packages/graph-kernel/src/execution/completeness.ts
    - packages/graph-kernel/src/execution/flywheel.ts
  call_site_search: >-
    rg -n "validateGraphSnapshots\\(|validateGraphSet\\(|validateSnapshotSet\\(|advanceFactory\\("
    --glob '!node_modules/**' --glob '!dist/**' . finds validation calls only in the
    metamodel test and advanceFactory calls only in completeness/flywheel tests; no composed
    factory entry point exists.
reproduction:
  command: >-
    node --input-type=module -e "import { advanceFactory, validateGraphSnapshots } from './packages/graph-kernel/dist/index.js'; import { completeInput } from './tests/kernel/completeness-fixtures.mjs'; import { validGraphValidationInput } from './tests/kernel/metamodel-fixtures.mjs'; const projection=completeInput(); const graphs=validGraphValidationInput(); graphs.snapshots[1].nodes[0].type='Persona'; const suppliedGraphs=advanceFactory({...projection,...graphs}); console.log({projectionOnlyAction:advanceFactory(projection).action,projectionHasSnapshots:Object.hasOwn(projection,'snapshots'),corruptGraphValidation:validateGraphSnapshots(graphs).valid,suppliedGraphsAction:suppliedGraphs.action,suppliedGraphsIssues:suppliedGraphs.completeness.gaps.invalidInputIssues.map((entry)=>entry.code)});"
  result:
    projection_only_action: complete
    projection_has_snapshots: false
    corrupt_graph_validation_valid: false
    corrupt_graph_validation_issues: [unknown_node_type, invalid_edge_endpoints]
    supplied_graphs_action: block_invalid_state
    supplied_graphs_issues: [invalid_completeness_input]
impact:
  statement: >-
    The component that can declare project completion is not tied to the component that
    enforces the graph grammar, exact cross-graph links, and approved snapshot hashes. A
    caller can fabricate a self-consistent closure projection with arbitrary IDs and still
    receive COMPLETE, defeating the required graph-to-execution traceability boundary.
recommended_repair:
  type: Repair
  instruction: >-
    Add one fail-closed composed factory entry point for external callers. It must receive
    the exact current graph snapshots and approved baseline refs, call validateGraphSnapshots
    first, and bind all closure IDs and cross-graph trace facts to those same validated
    snapshot/node/link refs before delegating to the existing pure scheduler/completeness
    logic. Invalid grammar, missing current snapshots, baseline mismatch, or any projection
    fact not derivable from the validated graphs must return block_invalid_state and never
    COMPLETE. Keep the existing pure helpers if useful, but do not expose them as the sole
    completion authority. Add graph-corruption, arbitrary-projection, valid-composed-path,
    deterministic, and non-mutation regressions.
