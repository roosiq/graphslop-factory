  - Independent verification evidence.
acceptance_checks:
  - id: REPAIR-V2-002-001-AC-01
    statement: Snapshot hashing omits contentHash, sorts every graph set by its documented stable identity, RFC 8785 canonicalizes, hashes UTF-8 bytes with SHA-256, and returns lowercase hexadecimal.
  - id: REPAIR-V2-002-001-AC-02
    statement: Validation recomputes the digest for every current and current-source snapshot before semantic graph validation and reports a stable snapshot_content_hash_mismatch issue.
  - id: REPAIR-V2-002-001-AC-03
    statement: Mutating a node, edge, cross-graph link, or source snapshot without updating its hash blocks validation and authoritative factory completion.
  - id: REPAIR-V2-002-001-AC-04
    statement: Baseline and cross-graph references can bind only to recomputed and verified snapshot digests.
  - id: REPAIR-V2-002-001-AC-05
    statement: Equivalent set ordering and object-key ordering produce the same digest while a material value change produces a different digest.
  - id: REPAIR-V2-002-001-AC-06
    statement: Hashing, validation, and factory evaluation are deterministic and do not mutate their inputs.
  - id: REPAIR-V2-002-001-AC-07
    statement: Full contracts, graph-kernel, root typecheck, diff check, and dependency-tree checks pass.
retry_limit: 1
required_evidence:
  - changed files and hashes
  - canonicalization and digest fixtures
  - valid and stale-hash mutation probes
  - current-source and baseline binding probes
  - full verification command results
  - independent specification-compliance review
  - drift closure mapping
implementer_assignment: fresh_implementation_agent
verifier_assignment: fresh_verification_agent
brief:
  job: Make the graph hash prove the graph words.
  use: The hash contract, current snapshots, validator, and factory.
  touch: Only snapshot hashing, validation, exports, fixtures, and their tests.
  dont: Change graph rules. Add features. Change baselines. Push or deploy.
  done: Change one graph fact without a new hash and it blocks. Real matching graphs still work. Show proof.
