      protected_baselines: [intent-v3, solution-v3]
    add_allowed_paths:
      - specs/001-initial-product-intent/contracts/graph-kernel.md
      - specs/001-initial-product-intent/data-model.md
    change: >-
      Canonical snapshot bytes omit the top-level contentHash and omit
      snapshotContentHash only from NodeRefs that name the enclosing snapshot.
      Hashes on every nonlocal reference remain canonical content.
    reason: >-
      Local NodeRefs must equal the enclosing snapshot hash, so including those
      self-reference fields makes the documented digest recursively depend on itself.
    implementation_started_before_authorization: false
    repair_policy: absolutely_necessary_only
