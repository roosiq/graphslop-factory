  - id: REPAIR-AC-002
    statement: Removing or bypassing the committed unit/browser toolchain smoke tests makes the corresponding canonical test command fail rather than pass with zero tests.
  - id: REPAIR-AC-003
    statement: A workspace source fixture without required build coverage makes the aggregate build gate fail; approved empty/support-only packages have an explicit non-build disposition.
  - id: REPAIR-AC-004
    statement: Formatting includes tsconfig and root test sources without targeting immutable specs, and ESLint explicitly ignores every generated cache/report path.
retry_limit: 1
required_evidence:
